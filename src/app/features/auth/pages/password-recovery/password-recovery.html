<main class="auth-shell">
  <section class="panel w-full max-w-lg">
    <a routerLink="/inicio-sesion" class="text-primary">← Volver a iniciar sesión</a>
    <h1 class="page-title mt-6">Recupera tu contraseña</h1>
    <p class="muted">Introduce tu correo para solicitar el enlace de recuperación.</p>
    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }
    @if (done()) {
      <p class="notice" role="status">
        Si la cuenta puede recibir recuperación, llegará un enlace a tu correo. Ábrelo en este mismo
        navegador.
      </p>
    } @else {
      <form (ngSubmit)="submit()" class="grid gap-5">
        <label
          >Correo electrónico<input
            class="field"
            type="email"
            name="email"
            [(ngModel)]="email"
            required
            autocomplete="email" /></label
        ><button class="btn" type="submit" [disabled]="busy()">
          {{ busy() ? 'Enviando…' : 'Enviar enlace de recuperación' }}
        </button>
      </form>
    }
  </section>
</main>
