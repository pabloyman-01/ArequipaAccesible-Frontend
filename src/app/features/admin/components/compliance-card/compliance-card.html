<section
  aria-labelledby="compliance-title"
  class="flex h-full flex-col justify-between rounded-2xl bg-gradient-to-br from-primary to-primary-container p-space-lg text-on-primary shadow-sm"
>
  <div>
    <div class="mb-space-sm flex items-center justify-between gap-space-sm">
      <div class="flex items-center gap-space-sm">
        <div
          class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-on-primary/10"
        >
          <span class="material-symbols-outlined text-[20px] text-on-primary" aria-hidden="true"
            >gavel</span
          >
        </div>
        <div>
          <h3 id="compliance-title" class="font-title-md text-title-md font-bold text-on-primary">
            Cumplimiento Ley N° 29973
          </h3>
          <span class="block font-body-sm text-[12px] text-on-primary-container"
            >Auditoría Provincial de Accesibilidad</span
          >
        </div>
      </div>
      <span
        class="shrink-0 rounded-full bg-on-primary px-2.5 py-1 text-[12px] font-bold text-primary"
        >{{ compliance().status }}</span
      >
    </div>

    <p class="mb-space-md font-body-sm text-body-sm leading-relaxed text-primary-fixed">
      {{ compliance().description }}
    </p>
  </div>

  <div
    class="grid grid-cols-1 gap-space-sm border-t border-on-primary/15 pt-space-xs text-[12px] sm:grid-cols-2"
  >
    @for (metric of compliance().metrics; track metric.label) {
      <div class="rounded-xl bg-on-primary/10 p-space-xs">
        <span class="block text-[10px] font-bold uppercase text-primary-fixed">{{
          metric.label
        }}</span>
        <span class="text-base font-bold text-on-primary">{{ metric.value }}</span>
      </div>
    }
  </div>
</section>
