<div
  class="flex flex-col gap-space-md rounded-lg bg-surface-container-lowest p-space-md shadow-[0_2px_8px_rgba(30,24,24,0.04)] lg:p-space-lg"
>
  <div class="flex flex-col items-stretch justify-between gap-space-md xl:flex-row xl:items-center">
    <div class="relative w-full flex-1 xl:max-w-xl">
      <label for="userSearch" class="sr-only">Buscar usuario por nombre, DNI, correo o distrito</label>
      <span
        class="material-symbols-outlined absolute left-space-md top-1/2 -translate-y-1/2 text-[20px] text-outline"
        aria-hidden="true"
        >search</span
      >
      <input
        id="userSearch"
        type="search"
        [value]="search()"
        (input)="search.set($any($event.target).value)"
        placeholder="Buscar por nombre, DNI, correo institucional o distrito..."
        class="w-full rounded-full bg-surface-container-low py-2.5 pl-11 pr-space-md font-body-md text-body-md text-on-surface shadow-sm transition-all placeholder:text-outline focus:bg-surface-container-lowest focus:outline-none"
      />
    </div>

    <div class="flex flex-wrap items-center gap-space-xs">
      <div class="relative">
        <label for="roleFilter" class="sr-only">Filtrar por rol</label>
        <select
          id="roleFilter"
          [value]="role()"
          (change)="role.set($any($event.target).value)"
          class="cursor-pointer appearance-none rounded-full bg-surface-container-low py-2 pl-3.5 pr-8 font-label-md text-label-md text-on-surface transition-colors hover:bg-surface-container focus:outline-none"
        >
          @for (option of roleOptions; track option.value) {
            <option [value]="option.value">{{ option.label }}</option>
          }
        </select>
        <span
          class="material-symbols-outlined pointer-events-none absolute right-2.5 top-1/2 -translate-y-1/2 text-[16px] text-outline"
          aria-hidden="true"
          >expand_more</span
        >
      </div>

      <div class="relative">
        <label for="userStatusFilter" class="sr-only">Filtrar por estado</label>
        <select
          id="userStatusFilter"
          [value]="status()"
          (change)="status.set($any($event.target).value)"
          class="cursor-pointer appearance-none rounded-full bg-surface-container-low py-2 pl-3.5 pr-8 font-label-md text-label-md text-on-surface transition-colors hover:bg-surface-container focus:outline-none"
        >
          @for (option of statusOptions; track option.value) {
            <option [value]="option.value">{{ option.label }}</option>
          }
        </select>
        <span
          class="material-symbols-outlined pointer-events-none absolute right-2.5 top-1/2 -translate-y-1/2 text-[16px] text-outline"
          aria-hidden="true"
          >expand_more</span
        >
      </div>

      <div class="relative">
        <label for="userDistrictFilter" class="sr-only">Filtrar por jurisdicción</label>
        <select
          id="userDistrictFilter"
          [value]="district()"
          (change)="district.set($any($event.target).value)"
          class="cursor-pointer appearance-none rounded-full bg-surface-container-low py-2 pl-3.5 pr-8 font-label-md text-label-md text-on-surface transition-colors hover:bg-surface-container focus:outline-none"
        >
          @for (option of districtOptions; track option.value) {
            <option [value]="option.value">{{ option.label }}</option>
          }
        </select>
        <span
          class="material-symbols-outlined pointer-events-none absolute right-2.5 top-1/2 -translate-y-1/2 text-[16px] text-outline"
          aria-hidden="true"
          >expand_more</span
        >
      </div>

      <button
        type="button"
        title="Limpiar filtros"
        aria-label="Limpiar filtros"
        (click)="clearFilters()"
        class="flex h-9 w-9 cursor-pointer items-center justify-center rounded-full bg-surface-container-low text-outline transition-colors hover:bg-surface-container hover:text-on-surface"
      >
        <span class="material-symbols-outlined text-[18px]" aria-hidden="true">filter_list_off</span>
      </button>
    </div>
  </div>

  <div
    class="flex flex-col items-start justify-between gap-space-xs pt-space-xs font-label-sm text-label-sm text-on-surface-variant sm:flex-row sm:items-center"
  >
    <span class="font-semibold text-primary"
      >Mostrando usuarios registrados en el sistema (Administradores y Ciudadanos)</span
    >
    <span class="text-outline"
      >Total sistema: {{ total() | number }} usuarios registrados</span
    >
  </div>
</div>
