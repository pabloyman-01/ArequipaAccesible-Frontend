<section
  aria-labelledby="barriers-title"
  class="flex h-full flex-col justify-between rounded-2xl border border-outline-variant/40 bg-surface-container-lowest p-space-lg shadow-sm"
>
  <div>
    <div class="mb-space-sm flex items-start justify-between gap-space-sm">
      <div>
        <span class="font-label-sm text-label-sm font-semibold uppercase tracking-wider text-outline"
          >Tipología Urbana</span
        >
        <h3 id="barriers-title" class="font-headline-md text-headline-md font-bold text-on-surface">
          Distribución por Barrera
        </h3>
      </div>
      <span
        class="shrink-0 rounded-full bg-primary-fixed px-2.5 py-1 font-label-sm text-label-sm font-bold text-primary"
        >Mes en Curso</span
      >
    </div>

    <div class="flex flex-col gap-space-sm pt-space-xs">
      @for (item of items(); track item.id) {
        <div>
          <div class="mb-1 flex items-center justify-between gap-space-sm text-body-sm">
            <span
              class="flex items-center gap-1.5 font-label-md text-label-md font-semibold text-on-surface"
            >
              <span
                [class]="
                  'material-symbols-outlined text-[18px] ' + barrierTheme(item.tone).icon
                "
                aria-hidden="true"
                >{{ item.icon }}</span
              >
              {{ item.label }}
            </span>
            <span [class]="'font-bold ' + barrierTheme(item.tone).text">
              {{ item.percentage }}%
              <span class="font-normal text-on-surface-variant">({{ item.count }})</span>
            </span>
          </div>
          <div class="h-2 w-full overflow-hidden rounded-full bg-surface-container-high">
            <div
              [class]="'h-full rounded-full ' + barrierTheme(item.tone).bar"
              [style.width.%]="item.percentage"
            ></div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
