<header
  class="fixed left-0 right-0 top-0 z-40 h-16 border-b border-surface-container-high bg-surface/90 shadow-[0_1px_8px_rgba(30,24,24,0.04)] backdrop-blur-xl lg:left-72"
>
  <div class="flex h-16 w-full items-center justify-between px-4 sm:px-6 lg:px-space-xl">
    <div class="flex items-center gap-space-sm lg:hidden">
      <div
        class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-primary-container"
      >
        <span class="material-symbols-outlined text-[20px] text-on-primary" aria-hidden="true"
          >accessible</span
        >
      </div>
      <span class="font-title-md text-title-md text-primary-container">Arequipa Accesible</span>
    </div>

    <nav
      aria-label="Ruta de navegación"
      class="hidden items-center gap-space-sm lg:flex"
    >
      <span
        class="hidden font-label-sm text-label-sm font-semibold uppercase tracking-wider text-outline xl:inline"
        >AREQUIPA</span
      >
      <span class="material-symbols-outlined hidden text-[16px] text-outline xl:inline" aria-hidden="true"
        >chevron_right</span
      >
      <span class="hidden font-label-sm text-label-sm text-outline xl:inline"
        >Gerencia de Desarrollo Urbano &amp; OMAPED</span
      >
      <span class="material-symbols-outlined hidden text-[16px] text-outline xl:inline" aria-hidden="true"
        >chevron_right</span
      >
      <span class="font-label-md text-label-md font-bold text-primary">Dashboard de Gestión</span>
    </nav>

    <div class="flex items-center gap-space-md">
      <div class="relative">
        <button
          type="button"
          aria-label="Notificaciones"
          class="flex h-9 w-9 items-center justify-center rounded-full bg-surface-container text-on-surface-variant transition-colors hover:bg-surface-container-high hover:text-on-surface"
        >
          <span class="material-symbols-outlined text-[20px]" aria-hidden="true">notifications</span>
        </button>
        <span
          class="absolute right-1.5 top-1.5 h-2 w-2 rounded-full bg-error"
          aria-hidden="true"
        ></span>
      </div>

      <div class="h-6 w-px bg-outline-variant" aria-hidden="true"></div>

      <div class="flex items-center gap-space-sm pl-space-xs">
        <div class="hidden text-right sm:block">
          <span class="block font-label-md text-label-md font-semibold leading-tight text-on-surface"
            >Valeria Paredes</span
          >
          <span class="block font-label-sm text-label-sm font-bold leading-tight text-primary"
            >Supervisora General</span
          >
        </div>
        <div
          class="flex h-9 w-9 items-center justify-center rounded-full bg-primary-container font-bold text-on-primary shadow-sm"
        >
          <span class="material-symbols-outlined text-[18px]" aria-hidden="true"
            >admin_panel_settings</span
          >
        </div>
      </div>
    </div>
  </div>
</header>
