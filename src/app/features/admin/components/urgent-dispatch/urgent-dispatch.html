<section
  aria-labelledby="urgent-title"
  class="flex h-full flex-col gap-space-md overflow-hidden rounded-2xl border border-outline-variant/40 bg-surface-container-lowest p-space-lg shadow-sm"
>
  <div
    class="flex flex-col items-center justify-between gap-space-sm border-b border-outline-variant/30 pb-space-sm text-center sm:flex-row sm:text-left"
  >
    <div class="min-w-0">
        <div class="flex items-center justify-center gap-2 sm:justify-start">
        <span class="font-label-sm text-label-sm font-bold uppercase tracking-wider text-error"
          >Bandeja Inmediata</span
        >
        <span class="rounded-full bg-error-container px-2 py-0.5 text-[11px] font-bold text-error"
          >{{ reports().length }} Prioritarios</span
        >
      </div>
      <h2 id="urgent-title" class="mt-0.5 font-headline-md text-headline-md font-bold text-on-surface">
        Acción Requerida
      </h2>
    </div>
    <a
      routerLink="/reportes"
      class="inline-flex shrink-0 items-center gap-1 rounded-full px-2 py-1 font-label-sm text-label-sm font-bold text-primary transition-colors hover:bg-primary-fixed hover:text-on-primary-fixed"
    >
      <span>Ver todos (51)</span>
      <span class="material-symbols-outlined text-[16px]" aria-hidden="true">arrow_forward</span>
    </a>
  </div>

  <div class="flex flex-col gap-space-sm">
    @for (report of reports(); track report.id) {
      <article
        class="flex min-w-0 flex-col gap-space-sm rounded-lg border border-outline-variant/40 bg-surface-container-low px-space-md py-space-sm transition-all hover:border-primary/40"
      >
        <div class="flex min-w-0 flex-wrap items-center justify-between gap-space-sm">
          <span class="shrink-0 font-mono text-label-sm font-bold text-primary">{{ report.id }}</span>
          <span
            [class]="
              'inline-flex max-w-full items-center gap-1 rounded-full px-2 py-0.5 text-center font-label-sm text-[11px] font-bold ' +
              severityMeta(report.severity).badge
            "
          >
            <span
              [class]="'h-1.5 w-1.5 rounded-full ' + severityMeta(report.severity).dot"
              aria-hidden="true"
            ></span>
            {{ severityMeta(report.severity).label }}
          </span>
        </div>

        <div class="min-w-0">
          <h3 class="break-words font-title-md text-body-md font-bold leading-normal text-on-surface">
            {{ report.title }}
          </h3>
          <p class="mt-space-xs break-words font-body-sm text-[12px] leading-relaxed text-on-surface-variant">
            {{ report.description }}
          </p>
        </div>

        <div
          class="flex flex-col items-center gap-space-xs border-t border-outline-variant/20 pt-space-sm text-center sm:flex-row sm:justify-between sm:text-left"
        >
          <span class="break-words font-body-sm text-[11px] text-on-surface-variant"
            >{{ report.time }} • {{ report.district }}</span
          >
          <button
            type="button"
            [attr.aria-label]="'Asignar reporte ' + report.id"
            class="flex items-center gap-1 rounded-full bg-primary px-3 py-1 font-label-sm text-label-sm font-bold text-on-primary shadow-xs transition-colors hover:bg-primary-container"
          >
            <span class="material-symbols-outlined text-[14px]" aria-hidden="true">send</span>
            Asignar
          </button>
        </div>
      </article>
    }
  </div>
</section>
