<div class="grid grid-cols-1 gap-space-md sm:grid-cols-2 lg:grid-cols-5">
  @for (kpi of kpis(); track kpi.id) {
    <div
      class="flex flex-col justify-between rounded-2xl bg-surface-container-lowest p-space-md shadow-[0_2px_8px_rgba(30,24,24,0.04)]"
    >
      <div class="mb-space-xs flex items-center justify-between gap-space-sm text-on-surface-variant">
        <span class="font-label-sm text-label-sm font-semibold uppercase tracking-wider">
          {{ kpi.label }}
        </span>
        <div
          [class]="
            'flex h-8 w-8 shrink-0 items-center justify-center rounded-full ' +
            theme(kpi.tone).iconWrapper
          "
        >
          <span class="material-symbols-outlined text-[18px]" aria-hidden="true">{{
            kpi.icon
          }}</span>
        </div>
      </div>

      <div>
        <div class="flex items-baseline gap-space-xs">
          <span
            [class]="
              'font-headline-lg text-headline-lg font-bold ' + theme(kpi.tone).value
            "
            >{{ kpi.value }}</span
          >
          <span
            [class]="
              'font-label-sm text-label-sm font-bold inline-flex items-center ' +
              theme(kpi.tone).emphasis
            "
            >{{ kpi.emphasis }}</span
          >
        </div>
        <span class="mt-1 block font-body-sm text-body-sm text-outline">{{ kpi.caption }}</span>
      </div>
    </div>
  }
</div>
