<header

>

      <span class="material-symbols-outlined text-[20px]" aria-hidden="true">account_balance</span>

  </div>

      <span class="absolute right-1 top-1 h-2.5 w-2.5 rounded-full border-2 border-surface bg-primary"></span>

        <span class="mt-0.5 inline-flex items-center gap-1 text-[11px] font-semibold leading-tight text-secondary">
          <span class="h-1.5 w-1.5 rounded-full bg-secondary"></span>
          Ciudadano Verificado
        </span>
      </div>
      <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full border-2 border-primary/20 bg-primary-fixed/50 text-primary shadow-sm">
        <span class="material-symbols-outlined text-[22px]" aria-hidden="true">person</span>
      </div>
    </div>
  </div>
</header>
