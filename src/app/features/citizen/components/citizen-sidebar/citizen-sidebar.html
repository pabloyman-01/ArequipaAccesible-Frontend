<aside
  class="fixed left-0 top-0 z-50 hidden h-full w-72 flex-col justify-between bg-surface-container-low shadow-[0_1px_8px_rgba(30,24,24,0.04)] lg:flex"
>
  <div class="flex flex-1 flex-col overflow-y-auto">
    <div class="flex items-center gap-space-sm p-space-lg">
      <div class="flex h-10 w-10 items-center justify-center rounded-full bg-primary-container text-on-primary shadow-sm">
        <span class="material-symbols-outlined text-[22px]" aria-hidden="true">accessible</span>
      </div>
      <div class="flex flex-col">
        <span class="font-title-md text-title-md leading-tight tracking-tight text-primary-container">Arequipa Accesible</span>
        <span class="font-label-sm text-label-sm uppercase tracking-wider text-on-surface-variant">Gobierno Municipal</span>
      </div>
    </div>

    <div class="px-space-md py-space-xs"><span class="px-space-sm font-label-sm text-label-sm uppercase tracking-wider text-outline">Panel Ciudadano</span></div>
    <nav aria-label="Navegación ciudadana" class="mt-space-xs flex flex-col gap-space-xs px-space-md">
      <a
        routerLink="/ciudadano"
        routerLinkActive
        [routerLinkActiveOptions]="{ exact: true }"
        #homeLink="routerLinkActive"
        [class]="homeLink.isActive ? activeLinkClass : inactiveLinkClass"
        [attr.aria-current]="homeLink.isActive ? 'page' : null"
      >
        <span class="material-symbols-outlined text-[20px]" aria-hidden="true">dashboard</span>
        <span>Inicio</span>
      </a>
      <a
        routerLink="/ciudadano/nuevo-reporte"
        routerLinkActive
        #newReportLink="routerLinkActive"
        [class]="newReportLink.isActive ? activeLinkClass : inactiveLinkClass"
        [attr.aria-current]="newReportLink.isActive ? 'page' : null"
      >
        <span class="material-symbols-outlined text-[20px]" aria-hidden="true">add_circle</span>
        <span>Nuevo Reporte</span>
      </a>
      <a
        routerLink="/ciudadano/reportes"
        routerLinkActive
        [routerLinkActiveOptions]="{ exact: true }"
        #reportsLink="routerLinkActive"
        [class]="reportsLink.isActive ? activeLinkClass : inactiveLinkClass"
        [attr.aria-current]="reportsLink.isActive ? 'page' : null"
      >
        <span class="material-symbols-outlined text-[20px]" aria-hidden="true">assignment</span>
        <span>Mis Reportes</span>
      </a>
    </nav>
  </div>

  <div class="flex flex-col gap-space-xs border-t border-outline-variant/30 px-space-lg py-space-md">
    <a
      href="https://www.congreso.gob.pe/Docs/leyes/ley29973.html"
      target="_blank"
      rel="noopener noreferrer"
      class="flex items-center justify-between py-1 font-label-sm text-label-sm font-medium text-on-surface-variant transition-colors hover:text-primary"
    >
      <span class="flex items-center gap-2">
        <span class="material-symbols-outlined text-[16px]" aria-hidden="true">menu_book</span>
        Ley General N° 29973
      </span>
      <span class="material-symbols-outlined text-[14px]" aria-hidden="true">open_in_new</span>
    </a>
    <span class="font-label-sm text-label-sm text-outline">v2.4 • Municipalidad de Arequipa</span>
  </div>
</aside>
